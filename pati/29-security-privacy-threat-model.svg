 token, rotation,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.1543" x="139.5" y="95.8076">secure storage, cihaz oturumu, riskli giri&#351; uyar&#305;s&#305;</text></g><g id="elem_GMN18"><path d="M608.5,181.6094 L608.5,207.1094 L573.6,211.1094 L608.5,215.1094 L608.5,240.6641 A0,0 0 0 0 608.5,240.6641 L921.4351,240.6641 A0,0 0 0 0 921.4351,240.6641 L921.4351,191.6094 L911.4351,181.6094 L608.5,181.6094 A0,0 0 0 0 608.5,181.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M911.4351,181.6094 L911.4351,191.6094 L921.4351,191.6094 L911.4351,181.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.437" x="614.5" y="200.1045">Tehdit: BOLA/IDOR, brute force, injection</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.9351" x="614.5" y="216.4561">Kontrol: resource authorization, schema validation,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.4897" x="614.5" y="232.8076">rate limit, idempotency, WAF, g&#252;venli hata</text></g><g id="elem_GMN21"><path d="M403.5,434.6094 L403.5,460.1094 L368.14,464.1094 L403.5,468.1094 L403.5,493.6641 A0,0 0 0 0 403.5,493.6641 L630.748,493.6641 A0,0 0 0 0 630.748,493.6641 L630.748,444.6094 L620.748,434.6094 L403.5,434.6094 A0,0 0 0 0 403.5,434.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M620.748,434.6094 L620.748,444.6094 L630.748,444.6094 L620.748,434.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.998" x="409.5" y="453.1045">Tehdit: sa&#287;l&#305;k/ileti&#351;im verisi s&#305;z&#305;nt&#305;s&#305;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.4771" x="409.5" y="469.4561">Kontrol: alan &#351;ifreleme, RLS/ABAC,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.248" x="409.5" y="485.8076">ayr&#305; anahtar, retention, eri&#351;im audit'i</text></g><g id="elem_GMN24"><path d="M160,181.6094 L160,207.1094 L125.46,211.1094 L160,215.1094 L160,240.6641 A0,0 0 0 0 160,240.6641 L444.0088,240.6641 A0,0 0 0 0 444.0088,240.6641 L444.0088,191.6094 L434.0088,181.6094 L160,181.6094 A0,0 0 0 0 160,181.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M434.0088,181.6094 L434.0088,191.6094 L444.0088,191.6094 L434.0088,181.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.2217" x="166" y="200.1045">Tehdit: malware, EXIF/PII, yetkisiz eri&#351;im</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5234" x="166" y="216.4561">Kontrol: AV scan, MIME magic, boyut limiti,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.0088" x="166" y="232.8076">EXIF temizleme, quarantine, k&#305;sa signed URL</text></g><g id="elem_GMN27"><path d="M643.5,44.6094 L643.5,70.1094 L608.43,74.1094 L643.5,78.1094 L643.5,103.6641 A0,0 0 0 0 643.5,103.6641 L926.0044,103.6641 A0,0 0 0 0 926.0044,103.6641 L926.0044,54.6094 L916.0044,44.6094 L643.5,44.6094 A0,0 0 0 0 643.5,44.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M916.0044,44.6094 L916.0044,54.6094 L926.0044,54.6094 L916.0044,44.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.2998" x="649.5" y="63.1045">Tehdit: ayr&#305;cal&#305;k k&#246;t&#252;ye kullan&#305;m&#305;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.5044" x="649.5" y="79.4561">Kontrol: MFA, just-in-time rol, maker-checker,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.9243" x="649.5" y="95.8076">PII maskeleme, export limiti, immutable audit</text></g><g id="elem_GMN30"><path d="M855.5,434.6094 L855.5,460.1094 L820.27,464.1094 L855.5,468.1094 L855.5,493.6641 A0,0 0 0 0 855.5,493.6641 L1134.4561,493.6641 A0,0 0 0 0 1134.4561,493.6641 L1134.4561,444.6094 L1124.4561,434.6094 L855.5,434.6094 A0,0 0 0 0 855.5,434.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1124.4561,434.6094 L1124.4561,444.6094 L1134.4561,444.6094 L1124.4561,434.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.9561" x="861.5" y="453.1045">Tehdit: sahte webhook, SSRF, tedarik&#231;i ihlali</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.9507" x="861.5" y="469.4561">Kontrol: imza + timestamp, replay korumas&#305;,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.6143" x="861.5" y="485.8076">egress policy, secret rotation, vendor review</text></g><!--link Client to API--><g id="link_Client_API"><path d="M94.36,93.1994 C101.25,97.0494 108.73,100.7894 116,103.6094 C262.97,160.5994 311.84,133.6294 462,181.6094 C471.27,184.5694 475.4703,186.0088 484.6203,189.7688 " fill="none" id="Client-to-API" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="490.17,192.0494,483.3658,184.9288,485.5452,190.1489,480.3251,192.3284,490.17,192.0494" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="23.8418" x="330" y="148.1045">TLS</text></g><!--link API to Svc--><g id="link_API_Svc"><path d="M530,230.2094 C530,253.8194 530,288.8694 