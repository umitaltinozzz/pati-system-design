ns-serif" font-size="11" lengthAdjust="spacing" textLength="114.9146" x="140.9705" y="160.2041">Ki&#351;iselle&#351;tirme a&#231;&#305;k m&#305;?</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="301.4375" x="47.709" y="319.668"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="281.4375" x="57.709" y="342.125">Pet t&#252;r&#252;/ya&#351;&#305;, a&#231;&#305;k tercihler ve ge&#231;mi&#351; i&#351;lem &#246;zetini al</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="317.0879" x="39.8838" y="374.7617"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="297.0879" x="49.8838" y="397.2188">Hassas sa&#287;l&#305;k ayr&#305;nt&#305;s&#305;n&#305; varsay&#305;lan feature set'ten &#231;&#305;kar</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="270.793" x="63.0313" y="429.8555"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.793" x="73.0313" y="452.3125">Ger&#231;ek zamanl&#305; uygun sa&#287;lay&#305;c&#305; adaylar&#305;n&#305; &#252;ret</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="338.1875" x="29.334" y="484.9492"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="318.1875" x="39.334" y="507.4063">Embedding/benzerlik + davran&#305;&#351; + ba&#287;lamsal skoru hesapla</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="347.7793" x="24.5381" y="540.043"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="327.7793" x="34.5381" y="562.5">G&#252;ven, do&#287;rulama, mesafe, fiyat ve &#231;e&#351;itlilik guardrail'i uygula</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="250.7598" x="73.0479" y="595.1367"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.7598" x="83.0479" y="617.5938">Tek sa&#287;lay&#305;c&#305;/marka yo&#287;unla&#351;mas&#305;n&#305; s&#305;n&#305;rla</text><path d="M279.46,640.2305 L279.46,665.7578 L259.46,669.7578 L279.46,673.7578 L279.46,699.2852 A0,0 0 0 0 279.46,699.2852 L528.0806,699.2852 A0,0 0 0 0 528.0806,699.2852 L528.0806,650.2305 L518.0806,640.2305 L279.46,640.2305 A0,0 0 0 0 279.46,640.2305 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M518.0806,640.2305 L518.0806,650.2305 L528.0806,650.2305 L518.0806,640.2305 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.3379" x="285.46" y="658.7256">&#8220;Yak&#305;n&#305;nda ve bug&#252;n uygun&#8221;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.6206" x="285.46" y="675.0771">&#8220;Benzer pet sahiplerince y&#252;ksek puanl&#305;&#8221;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.9434" x="285.46" y="691.4287">&#8220;Daha &#246;nce kulland&#305;&#287;&#305;n hizmet t&#252;r&#252;&#8221;</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="122.0645" x="137.3955" y="652.2109"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.0645" x="147.3955" y="674.668">&#214;neri nedenini &#252;ret</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="186.7285" x="105.0635" y="719.2852"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.7285" x="115.0635" y="741.7422">Ke&#351;if i&#231;in kontroll&#252; &#231;e&#351;itlilik ekle</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="362.1172" x="17.3691" y="774.3789"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="342.1172" x="27.3691" y="796.8359">G&#246;sterim, t&#305;klama, rezervasyon ve gizleme geri bildirimini kaydet</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="172.0977" x="112.3789" y="878.3906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.0977" x="122.3789" y="900.8477">Negatif tercihi an&#305;nda uygula</text><polygon fill="#F1F1F1" points="118.6321,829.4727,278.2234,829.4727,290.2234,841.4727,278.2234,853.4727,118.6321,853.4727,106.6321,841.4727,118.6321,829.4727" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="22.0107" x="202.4277" y="864.8916">Evet</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="159.5913" x="118.6321" y="845.9736">Kullan&#305;c&#305; &#8216;bunu &#246;nerme&#8217; dedi mi?</text><polygon fill="#F1F1F1" points="198.4277,933.4844,210.4277,945.4844,198.4277,957.4844,186.4277,945.4844,198.4277,933.4844" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="374.8555" x="11" y="977.4844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="354.8555" x="21" y="999.9414">Model etkisini d&#246;n&#252;&#351;&#252;m yan&#305;nda &#351;ik&#226;yet, iptal ve fiyat adaletiyle &#246;l&#231;</text><path d="M229.4277,1022.5781 L229.4277,1048.1055 L209.4277,1052.1055 L229.4277,1056.1055 L229.4277,1081.6328 A0,0 0 0 0 229.4277,1081.6328 L606.582,1081.6328 A0,0 0 0 0 606.